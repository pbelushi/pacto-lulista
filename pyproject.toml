[project]
name = "pacto-lulista"
version = "0.1.0"
description = "O pacto lulista mudou de perfil? Análise municipal 2006-2026"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml",
    "requests",
    "truststore",
]

[project.optional-dependencies]
analise = [
    "geopandas",
    "geobr",
    "statsmodels",
    "linearmodels",
    "libpysal",
    "esda",
    "spreg",
    "scikit-learn",
    "tslearn",
    "matplotlib",
    "seaborn",
]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
