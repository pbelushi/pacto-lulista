[project]
name = "pacto-lulista"
version = "1.0.0"
description = "O pacto lulista mudou de perfil? Painel municipal 2006–2026, locais de votação 2010–2026 e episódios de polarização comparados (1900–2025)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
# faixas testadas; versões exatas da execução publicada em requirements.txt (Python 3.13.7, Windows 11)
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=15",
    "pyyaml>=6",
    "requests>=2.31",
    "urllib3>=2",
    "truststore>=0.9",
    "tabulate>=0.9",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "geopandas>=1.0",
    "shapely>=2.1",
    "pyogrio>=0.7",
    "pyproj>=3.6",
    "geobr>=0.2",
    "libpysal>=4.10",
    "esda>=2.5",
    "spreg>=1.4",
    "pyfixest>=0.30",
    "lifelines>=0.29",
    "factor_analyzer>=0.5",
    "pyreadr>=0.5",
]

[project.optional-dependencies]
# inferência ecológica R×C do pacto 2.0 (não entra no pipeline: não termina em tempo útil; ver pendencias.md)
ei = ["pyei>=1.1"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
